services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    container_name: memorizer-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgmem
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    container_name: memorizer-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Memorizer application
  memorizer:
    image: petabridge/memorizer:latest
    restart: unless-stopped
    container_name: memorizer-dev
    environment:
      - ConnectionStrings__Storage=Host=postgres;Port=5432;Database=postgmem;Username=postgres;Password=postgres
      - MEMORIZER_Embeddings__Provider=openai
      - MEMORIZER_Embeddings__ApiUrl=http://100.115.249.121:1234/v1
      - MEMORIZER_Embeddings__Model=text-embedding-nomic-embed-text-v1.5
      - MEMORIZER_LLM__Provider=openai
      - MEMORIZER_LLM__ApiUrl=http://100.115.249.121:1234/v1
      - MEMORIZER_LLM__Model=google/gemma-4-12b
      - MEMORIZER_LLM__Timeout=00:02:00
      - MEMORIZER_LLM__Chunking__MinCharactersForChunking=2000
      - MEMORIZER_LLM__Chunking__TargetChunkSize=1500
      - MEMORIZER_Server__CanonicalUrl=http://localhost:5000

      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: